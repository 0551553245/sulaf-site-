<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>طلبات سُلاف</title>
<link rel="icon" href="/favicon.ico">
<style>
@font-face{font-family:"Muna";src:url(/store/a-b7ac5f956a.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Muna";src:url(/store/a-9c09b2f0d5.woff2) format("woff2");font-weight:900;font-display:swap}
:root{--sand:#EADCC3;--cream:#F3ECDD;--forest:#344038;--ink:#1F2622;--muted:#6b6a5f;--red:#9a3b2e;--amber:#a8772a}
*{box-sizing:border-box}
body{margin:0;background:var(--sand);color:var(--ink);font-family:"Muna",system-ui,sans-serif;font-size:16px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom,0)}
button,input,select{font:inherit}
.mono{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:var(--forest);color:var(--cream);padding:calc(14px + env(safe-area-inset-top,0)) 16px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{margin:0;font-size:20px;font-weight:900}
header button{background:none;border:1px solid var(--cream);color:var(--cream);padding:6px 12px;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:16px}
.login{max-width:380px;margin:12vh auto 0;background:var(--cream);padding:28px 22px}
.login h2{margin:0 0 18px;font-size:26px;color:var(--forest)}
label{display:block;font-weight:900;font-size:14px;margin:12px 0 6px}
input{width:100%;height:50px;border:2px solid var(--forest);background:#fff;padding:0 12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;width:100%;margin-top:18px;background:var(--forest);color:var(--cream);border:0;font-weight:900;font-size:17px;cursor:pointer;text-decoration:none}
.err{color:var(--red);min-height:24px;margin-top:10px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--cream);padding:12px}
.stat b{display:block;font-size:24px;color:var(--forest)}
.stat span{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:4px}
.tabs button{flex:none;border:2px solid var(--forest);background:transparent;color:var(--forest);padding:6px 14px;font-weight:900;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--forest);color:var(--cream)}
.opts{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;font-size:14px;color:var(--muted)}
.opts label{display:flex;align-items:center;gap:6px;margin:0;font-weight:400;font-size:14px}
.opts input{width:auto;height:auto}
.card{background:var(--cream);padding:16px;margin-bottom:12px;border-inline-start:6px solid var(--forest)}
.card.st-delivered{opacity:.7;border-color:#8a9a8f}
.card.st-cancelled{opacity:.55;border-color:var(--red)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.who{font-weight:900;font-size:19px}
.when{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:12px;font-weight:900;padding:2px 8px;background:var(--sand)}
.chip.paid{background:var(--forest);color:var(--cream)}
.chip.pending{background:var(--amber);color:#fff}
.chip.failed{background:var(--red);color:#fff}
.chip.wa{background:#25D366;color:#063}
ul{margin:8px 0;padding-inline-start:18px}
.tot{font-weight:900}
.addr{margin:6px 0;white-space:pre-line}
.note{background:var(--sand);padding:8px 10px;margin:8px 0;font-size:14px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.acts a{display:flex;align-items:center;justify-content:center;height:44px;border:2px solid var(--forest);color:var(--forest);font-weight:900;text-decoration:none;font-size:14px}
.acts a.off{opacity:.35;pointer-events:none}
select{width:100%;height:46px;margin-top:8px;border:2px solid var(--forest);background:#fff;padding:0 10px;font-weight:900}
.empty{text-align:center;color:var(--muted);padding:40px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>طلبات سُلاف</h1><div><button type="button" id="refresh" hidden>تحديث</button> <button type="button" id="logout" hidden>خروج</button></div></header>
<main>
  <form class="login" id="login" hidden>
    <h2>دخول المالك</h2>
    <label for="em">الإيميل</label><input id="em" type="email" autocomplete="username" required class="mono" value="Info@sulav.co">
    <label for="pw">كلمة المرور</label><input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">دخول</button>
    <p class="err" id="lerr" role="alert"></p>
  </form>

  <section id="app" hidden>
    <div class="stats">
      <div class="stat"><b class="mono" id="sNew">0</b><span>طلبات جديدة</span></div>
      <div class="stat"><b class="mono" id="sToday">0</b><span>طلبات اليوم</span></div>
      <div class="stat"><b class="mono" id="sSales">0</b><span>مبيعات اليوم (ر.س)</span></div>
    </div>
    <div class="tabs" id="tabs">
      <button type="button" data-f="open" aria-pressed="true">الحالية</button>
      <button type="button" data-f="new" aria-pressed="false">جديد</button>
      <button type="button" data-f="delivering" aria-pressed="false">قيد التوصيل</button>
      <button type="button" data-f="delivered" aria-pressed="false">تم التوصيل</button>
      <button type="button" data-f="all" aria-pressed="false">الكل</button>
    </div>
    <div class="opts"><label><input type="checkbox" id="unpaid"> إظهار الطلبات اللي ما اكتمل دفعها</label><span id="updated"></span></div>
    <div id="list"></div>
  </section>
</main>
<script>
(function(){
const $=s=>document.querySelector(s);
const ST={new:'جديد',delivering:'قيد التوصيل',delivered:'تم التوصيل',cancelled:'ملغي'};
const PAY={paid:['مدفوع','paid'],pending:['بانتظار الدفع','pending'],failed:['فشل الدفع','failed'],not_required:['طلب واتساب','wa']};
let orders=[],filter='open',seen=null,timer;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const intl=p=>'966'+String(p||'').replace(/^0/,'');
const fmt=d=>new Date(d).toLocaleString('ar-SA-u-nu-latn',{timeZone:'Asia/Riyadh',weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const dayKey=d=>new Date(d).toLocaleDateString('en-CA',{timeZone:'Asia/Riyadh'});
const isReal=o=>o.payment_status==='paid'||o.payment_status==='not_required';

async function load(){
  const r=await fetch('/api/admin/orders',{cache:'no-store'});
  if(r.status===401){show(false);return}
  if(!r.ok){$('#updated').textContent='تعذّر التحديث';return}
  const d=await r.json();orders=d.orders||[];
  const realNew=orders.filter(o=>isReal(o)&&o.status==='new').map(o=>o.ref);
  if(seen&&realNew.some(x=>!seen.has(x))){try{navigator.vibrate&&navigator.vibrate(200)}catch(e){};document.title='● طلب جديد | سُلاف'}
  seen=new Set(realNew);
  $('#updated').textContent='آخر تحديث '+new Date().toLocaleTimeString('ar-SA-u-nu-latn',{timeZone:'Asia/Riyadh',hour:'numeric',minute:'2-digit'});
  render();
}
function render(){
  const today=dayKey(Date.now()),real=orders.filter(isReal);
  $('#sNew').textContent=real.filter(o=>o.status==='new').length;
  const t=real.filter(o=>dayKey(o.created_at)===today&&o.status!=='cancelled');
  $('#sToday').textContent=t.length;$('#sSales').textContent=t.reduce((a,o)=>a+o.total,0);
  let l=$('#unpaid').checked?orders:real;
  if(filter==='open')l=l.filter(o=>o.status==='new'||o.status==='delivering');
  else if(filter!=='all')l=l.filter(o=>o.status===filter);
  $('#list').innerHTML=l.length?l.map(card).join(''):'<p class="empty">ما فيه طلبات هنا.</p>';
}
function card(o){
  const [pl,pc]=PAY[o.payment_status]||[o.payment_status,''];
  const items=(o.items||[]).map(i=>`<li>${esc(i.name)} ${i.s} مل × <span class="mono">${i.n}</span></li>`).join('');
  const addr=[o.city,o.district,o.address].filter(Boolean).map(esc).join('، ');
  const wa=`https://wa.me/${intl(o.phone)}?text=${encodeURIComponent('مرحباً '+o.name+'، معك سُلاف بخصوص طلبك '+o.ref)}`;
  return `<article class="card st-${o.status}">
  <div class="top"><div><div class="who">${esc(o.name)}</div><div class="when">${fmt(o.created_at)} · <span class="mono">${esc(o.ref)}</span></div></div>
  <div class="tot"><span class="mono">${o.total}</span> ر.س</div></div>
  <div class="chips"><span class="chip ${pc}">${pl}</span><span class="chip">${ST[o.status]}</span>${o.shipping?'':'<span class="chip">توصيل مجاني</span>'}</div>
  <ul>${items}</ul>
  <div class="addr">${addr}</div>
  ${o.note?`<div class="note">${esc(o.note)}</div>`:''}
  <div class="acts">
    <a href="tel:${esc(o.phone)}">اتصال&nbsp;<span class="mono">${esc(o.phone)}</span></a>
    <a href="${wa}" target="_blank" rel="noopener">واتساب</a>
    <a href="${esc(o.location||'')}" target="_blank" rel="noopener" class="${o.location?'':'off'}">${o.location?'الموقع على الخريطة':'بدون موقع'}</a>
  </div>
  <select data-ref="${esc(o.ref)}" aria-label="حالة الطلب">${Object.entries(ST).map(([k,v])=>`<option value="${k}"${k===o.status?' selected':''}>${v}</option>`).join('')}</select>
  </article>`;
}
function show(inApp){$('#login').hidden=inApp;$('#app').hidden=!inApp;$('#logout').hidden=!inApp;$('#refresh').hidden=!inApp;clearInterval(timer);if(inApp){load();timer=setInterval(load,30000)}}

$('#login').onsubmit=async e=>{e.preventDefault();$('#lerr').textContent='';
  const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#em').value,password:$('#pw').value})});
  if(r.ok){$('#pw').value='';show(true)}else $('#lerr').textContent=r.status===503?'صفحة الطلبات لسا ما تفعّلت: أضف ADMIN_PASSWORD و ORDER_SECRET في Vercel.':'الإيميل أو كلمة المرور غلط.'};
$('#logout').onclick=async()=>{await fetch('/api/admin/login',{method:'DELETE'});show(false)};
$('#refresh').onclick=load;
$('#unpaid').onchange=render;
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.f;document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()};
$('#list').onchange=async e=>{const s=e.target.closest('select');if(!s)return;s.disabled=true;
  const r=await fetch('/api/admin/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ref:s.dataset.ref,status:s.value})});
  if(r.ok){const o=orders.find(x=>x.ref===s.dataset.ref);if(o)o.status=s.value;render()}else{s.disabled=false;alert('ما انحفظ التعديل، جرّب مرة ثانية.')}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){document.title='طلبات سُلاف';if(!$('#app').hidden)load()}});
fetch('/api/admin/orders',{cache:'no-store'}).then(r=>show(r.ok));
})();
</script>
</body>
</html>
